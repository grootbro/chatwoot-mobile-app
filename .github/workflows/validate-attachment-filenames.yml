name: Validate attachment filename fix
on:
  push:
    branches: [validation/attachment-filenames-1196]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit
      - name: Tests
        if: ${{ !cancelled() }}
        run: pnpm test --runInBand --ci
      - name: Patch integrity
        if: ${{ !cancelled() }}
        run: git diff --check 151c59f...HEAD
